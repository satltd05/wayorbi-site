<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fb" />
    <link rel="icon" type="image/png" href="/logo-wayorbi.png" />
    <link rel="apple-touch-icon" href="/logo-wayorbi.png" />
    <title>Wayorbi — Le réseau social des carnets de voyage</title>
    <meta
      name="description"
      content="Wayorbi est un projet de réseau social consacré aux carnets de voyage : des récits structurés qui relient étapes, transports, budgets et conseils. Ce site présente le concept et des démonstrations."
    />
    <!-- Aperçu des liens partagés. __SITE_URL__ est remplacé à la compilation par l'adresse publique (variable SITE_URL, voir README). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wayorbi" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Wayorbi — Le réseau social des carnets de voyage" />
    <meta property="og:description" content="Un projet de réseau social où les voyageurs partagent des carnets structurés : itinéraires, transports, budgets et conseils." />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Wayorbi et photos de voyage" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; text-align: center">Le site Wayorbi a besoin de JavaScript pour afficher ses démonstrations interactives.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
